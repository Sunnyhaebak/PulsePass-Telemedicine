services:
  # 1. PostgreSQL Relational Database (ACID Storage)
  postgres:
    image: postgres:16-alpine
    container_name: telemed_postgres
    restart: always
    environment:
      POSTGRES_USER: telemed_admin
      POSTGRES_PASSWORD: telemed_password_2026
      POSTGRES_DB: telemed_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U telemed_admin -d telemed_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache & Distributed Lock Engine
  redis:
    image: redis:7-alpine
    container_name: telemed_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. NestJS Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telemed_backend
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://telemed_admin:telemed_password_2026@postgres:5432/telemed_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_telemed_jwt_key_2026
      AWS_REGION: ap-south-1
      AWS_S3_BUCKET: telemed-medical-vault-prod
      RAZORPAY_KEY_ID: rzp_test_placeholder_key
      RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
      FRONTEND_URL: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Next.js React Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telemed_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000/chat
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
